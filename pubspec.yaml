name: just_sprite_editor
description: "A pixel-art sprite editor and animator: layers, frames, tags, onion skin, an animation state-machine graph, and an editor module for just_game_engine_editor."
version: 0.1.0-beta.1
homepage: https://github.com/just-unknown-dev/just-sprite-editor
repository: https://github.com/just-unknown-dev/just-sprite-editor
issue_tracker: https://github.com/just-unknown-dev/just-sprite-editor/issues
# A plugin: shared through the Asset Store from GitHub, never pub.dev.
publish_to: none

environment:
  sdk: ^3.11.0
  # just_game_engine (through just_box_2d and just_jolt) needs this.
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  just_game_engine: ^2.0.0-dev.2
  just_signals: ^1.0.2
  # zlib for .jsprite cels, PNG pixels and Aseprite cels. Pure Dart, so the
  # document core runs on the web too.
  just_deflate: ^0.1.0

  # The system's Open dialog, for bringing a sprite in from outside the
  # project (lib/src/studio/studio_library.dart).
  file_selector: ^1.1.0

  # The editor's module contract and shared kit: keys, fields, package
  # asset paths. The studio's widgets use it as well as lib/editor.dart.
  #
  # Like file_selector, design-time only: every library of this package is
  # (just_store.json bans them all from a game's code), and the store adds
  # the package to a game as a dev dependency, so neither reaches a release
  # build.
  just_editor_core: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
