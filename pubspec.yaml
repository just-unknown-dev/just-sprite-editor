name: just_sprite_editor
description: "A pixel-art sprite editor and animator: layers, frames, tags, onion skin, an animation state-machine graph, and an editor module for just_game_engine_editor."
version: 0.1.0
homepage: https://github.com/just-unknown-dev/just-sprite-editor
repository: https://github.com/just-unknown-dev/just-sprite-editor
issue_tracker: https://github.com/just-unknown-dev/just-sprite-editor/issues

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  just_game_engine: ^2.0.0
  just_signals: ^1.0.2
  # zlib for .jsprite cels, PNG pixels and Aseprite cels. Pure Dart, so the
  # document core runs on the web too.
  just_deflate: ^0.1.0

  # The system's Open dialog, for bringing a sprite in from outside the
  # project. Design-time only, like the editor dependency below: a game
  # never reaches this package at all.
  file_selector: ^1.1.0

  # Design-time only. `lib/just_sprite_editor.dart` never imports it; only
  # `lib/editor.dart` does, and a game never imports that.
  just_editor_core: ^0.1.0-dev.1
  just_game_engine_formats: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
